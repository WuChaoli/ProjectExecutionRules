schema_version: 2
rules_version: 1.0.0

profiles:
  python:
    - python

skills:
  git:
    file: rules/core/git-rules.md
    invocation: model
    adapters:
      - codex
      - claude
  pull-request:
    file: rules/core/pull-request-rules.md
    invocation: model
    adapters:
      - codex
      - claude
  debug:
    file: rules/core/debug-rules.md
    invocation: model
    adapters:
      - codex
      - claude
  observability:
    file: rules/core/observability-rules.md
    invocation: model
    adapters:
      - codex
      - claude
  architecture:
    file: rules/core/architecture-rules.md
    invocation: model
    adapters:
      - codex
      - claude
  external-services:
    file: rules/core/external-services-rules.md
    invocation: model
    adapters:
      - codex
      - claude
  rules-reviewer:
    file: adapters/codex/skills/rules-reviewer/SKILL.md
    invocation: user
    adapters:
      - codex
      - claude
  agent-governance:
    file: adapters/codex/skills/agent-governance/SKILL.md
    invocation: user
    adapters:
      - codex
  tool-governance:
    file: adapters/codex/skills/tool-governance/SKILL.md
    invocation: user
    adapters:
      - codex

agents:
  rules-reviewer:
    file: adapters/codex/agents/rules-reviewer.toml
    skills:
      - pull-request
    adapters:
      - codex
      - claude

rules:
  security:
    file: core/security-rules.md
    activation: always
    core: true
    required: true
  testing:
    file: core/testing-rules.md
    activation: paths
    paths:
      - "tests/**/*"
      - "test/**/*"
    core: true
  documentation:
    file: core/documentation-rules.md
    activation: paths
    paths:
      - "**/*.md"
    core: true
  git:
    file: core/git-rules.md
    activation: task
    tasks:
      - branch
      - commit
      - merge
      - worktree
    skills:
      - git
    core: true
  pull-request:
    file: core/pull-request-rules.md
    activation: task
    tasks:
      - pull-request
      - pull-request-review
    skills:
      - pull-request
    agents:
      - rules-reviewer
    core: true
  ci-cd:
    file: core/ci-cd-rules.md
    activation: paths
    paths:
      - ".github/workflows/**/*"
      - ".gitlab-ci.yml"
    core: true
  debug:
    file: core/debug-rules.md
    activation: task
    tasks:
      - debug
      - troubleshoot
    skills:
      - debug
    core: true
  observability:
    file: core/observability-rules.md
    activation: task
    tasks:
      - logging
      - tracing
      - performance
    skills:
      - observability
    core: true
  architecture:
    file: core/architecture-rules.md
    activation: task
    tasks:
      - architecture
      - interface
      - data-flow
    skills:
      - architecture
    core: true
  external-services:
    file: core/external-services-rules.md
    activation: task
    tasks:
      - external-service
      - integration
    skills:
      - external-services
    core: true
  agent:
    file: core/agent-rules.md
    activation: explicit
    commands:
      - agent-governance
    skills:
      - agent-governance
    core: true
  tool:
    file: core/tool-rules.md
    activation: explicit
    commands:
      - tool-governance
    skills:
      - tool-governance
    core: true
  harness:
    file: core/harness-rules.md
    activation: explicit
    commands:
      - rules-review
    skills:
      - rules-reviewer
    agents:
      - rules-reviewer
    core: true
  python:
    file: profiles/python/python-rules.md
    activation: paths
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "uv.lock"
      - "poetry.lock"
      - "Pipfile.lock"
    core: false
