[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "project-execution-rules"
version = "0.1.0"
description = "Interactive local lifecycle manager for Codex project execution rules"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1,<4",
    "jsonschema>=4.25,<5",
    "platformdirs>=4,<5",
    "pyyaml>=6,<7",
    "rich>=14,<15",
    "typer>=0.16,<1",
]

[project.scripts]
project-rules = "project_execution_rules.cli:app"

[dependency-groups]
dev = [
    "pyright>=1.1.411,<1.2",
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/project_execution_rules"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
